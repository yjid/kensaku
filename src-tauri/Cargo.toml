[package]
name = "kensaku"
version = "0.3.0"
default-run = "kensaku"
description = "Blazing-fast local file and content search"
authors = ["yjid"]
edition = "2024"

[lib]
name = "kensaku_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "kensaku-cli"
path = "src/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.26"
nucleo-matcher = "0.3"
jwalk = "0.9"
notify = "8"
fs4 = "0.13"
dirs = "6"
log = "0.4"
auto-launch = "0.5"
parking_lot = "0.12"
open = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
rayon = "1.10"
lopdf = "0.46.0"
quick-xml = "0.42.0"
zip = "9.1.0"
ureq = { version = "2", features = ["tls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
