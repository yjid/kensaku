[package]
name = "kensaku"
version = "0.3.3"
default-run = "kensaku"
description = "Blazing-fast local file and content search"
authors = ["yjid"]
edition = "2024"

[lib]
name = "kensaku_lib"
crate-type = ["staticlib", "cdylib", "rlib"]



[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.26"
nucleo-matcher = "0.3"
jwalk = "0.9"
notify = "8"
fs4 = "0.13"
dirs = "6"
log = "0.4"
auto-launch = "0.5"
parking_lot = "0.12"
libc = "0.2"
open = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
sha2 = "0.10"
rayon = "1.10"
lopdf = "0.46.0"
quick-xml = "0.42.0"
zip = "9.1.0"
ureq = { version = "2", features = ["tls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
paddleocr_rs_onnx = { version = "0.2.8", default-features = false, optional = true }
ort = { version = "2.0.0-rc.15", optional = true }
interprocess = "2.4.7"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# `make dev` / `tauri dev` should not be 10-50x slower than release for the
# heavy dependencies. Optimizing dependency code (image decode, Tantivy, PDF
# parsing) while leaving Kensaku's own code at debug speed keeps incremental
# rebuilds fast and makes first-scan/profile work realistic. Dropping dependency
# debug info also cuts several GB from target/debug.
[profile.dev.package."*"]
opt-level = 2
debug = false

[features]
accurate-ocr = ["dep:paddleocr_rs_onnx"]
smart-embeddings = ["dep:ort"]
native-ocr-macos = []
native-ocr-windows = []
