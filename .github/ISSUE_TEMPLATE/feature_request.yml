name: Feature request
description: Suggest something that would make Kensaku better
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the existing issues and [docs/ARCHITECTURE.md](https://github.com/yjid/kensaku/blob/master/docs/ARCHITECTURE.md)
        first — many ideas are already planned or deliberately deferred.

        Kensaku is a local search index and a read-only backend for agents. It does
        not include an LLM, cloud sync, or telemetry.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Be concrete about the interaction.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds, other tools, or a smaller version of the idea.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Search / ranking
        - Query language
        - Indexing / watcher
        - Documents / OCR
        - Images
        - UI / themes
        - Settings / diagnostics
        - Agent CLI / MCP
        - Packaging / install
        - Other
    validations:
      required: true
