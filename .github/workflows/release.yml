name: Release builds

# Builds unsigned desktop bundles and the agent CLI for Linux, macOS and
# Windows, then assembles a draft GitHub release with every asset and a
# SHA256SUMS file. A maintainer reviews and publishes the draft; signing
# secrets are still intentionally absent from this workflow.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Bundles (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact: kensaku-linux
            args: ""
          - platform: macos-latest
            artifact: kensaku-macos
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            artifact: kensaku-windows
            args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            ${{
              matrix.platform == 'macos-latest'
                && 'aarch64-apple-darwin,x86_64-apple-darwin'
                || ''
            }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Unsigned builds: no certificates or notarization secrets are required.
      # To sign later, add the Apple/Windows secrets and the relevant Tauri
      # signing env vars here (macOS: APPLE_CERTIFICATE, APPLE_SIGNING_IDENTITY,
      # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID; Windows: WINDOWS_CERTIFICATE).
      - name: Build bundles
        run: bunx tauri build ${{ matrix.args }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/*/release/bundle/**
          if-no-files-found: error

  cli:
    name: CLI (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact: kensaku-cli-linux
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            artifact: kensaku-cli-macos
            target: aarch64-apple-darwin
          - platform: windows-latest
            artifact: kensaku-cli-windows
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # generate_context! embeds the frontend, so build it before cargo.
      - name: Build frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build CLI
        run: cargo build --release --manifest-path cli/Cargo.toml

      - name: Build universal macOS CLI
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --manifest-path cli/Cargo.toml --target x86_64-apple-darwin
          mkdir -p dist
          # The host (macos-latest) is arm64, so the generic build above is the
          # aarch64 slice; only the x86_64 slice needs an explicit --target.
          lipo -create \
            cli/target/release/kensaku-cli \
            cli/target/x86_64-apple-darwin/release/kensaku-cli \
            -output dist/kensaku-cli-macos-universal

      - name: Stage CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          os="$(echo "${RUNNER_OS}" | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          case "${arch}" in
            x86_64|amd64) arch="x86_64" ;;
            aarch64|arm64) arch="aarch64" ;;
          esac
          cp cli/target/release/kensaku-cli "dist/kensaku-cli-${os}-${arch}"
          chmod +x "dist/kensaku-cli-${os}-${arch}"

      - name: Stage CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
          Copy-Item cli/target/release/kensaku-cli.exe "dist/kensaku-cli-windows-$arch.exe"

      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/kensaku-cli-*
          if-no-files-found: error

  # Assemble one draft GitHub release from both build jobs. A maintainer
  # reviews the draft, then publishes it; this keeps signing and announcement
  # decisions out of tag pushes while still collecting every asset in one
  # place (bundles, CLI binaries, and SHA256SUMS).
  publish:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bundle, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout must run before the artifact download: checkout defaults to
      # `clean: true`, which wipes the workspace and deletes the downloaded
      # artifacts (this is what broke the v1.0.1 release runs).
      - name: Checkout (for release notes generation)
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Check artifacts arrived
        run: |
          test -d artifacts
          find artifacts -type f | grep -q . || { echo "no artifacts downloaded"; exit 1; }

      - name: Checksums
        run: |
          cd artifacts
          find . -type f ! -name SHA256SUMS -exec sha256sum {} + | sort -k2 > SHA256SUMS

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "Kensaku $TAG" --generate-notes
          find artifacts -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
