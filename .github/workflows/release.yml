name: Release builds

# Builds unsigned desktop bundles and the agent CLI for Linux, macOS and
# Windows, and uploads them as workflow artifacts. Publishing the GitHub
# release is done from a maintainer machine with `gh release create` +
# `gh release upload` (see docs/RELEASING.md), which keeps this workflow free
# of release-token permissions and signing secrets.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Bundles (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact: kensaku-linux
            args: ""
          - platform: macos-latest
            artifact: kensaku-macos
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            artifact: kensaku-windows
            args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            ${{
              matrix.platform == 'macos-latest'
                && 'aarch64-apple-darwin,x86_64-apple-darwin'
                || ''
            }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Unsigned builds: no certificates or notarization secrets are required.
      # To sign later, add the Apple/Windows secrets and the relevant Tauri
      # signing env vars here (macOS: APPLE_CERTIFICATE, APPLE_SIGNING_IDENTITY,
      # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID; Windows: WINDOWS_CERTIFICATE).
      - name: Build bundles
        run: bunx tauri build ${{ matrix.args }}

      - name: Upload bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: warn

  cli:
    name: CLI (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact: kensaku-cli-linux
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            artifact: kensaku-cli-macos
            target: aarch64-apple-darwin
          - platform: windows-latest
            artifact: kensaku-cli-windows
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # generate_context! embeds the frontend, so build it before cargo.
      - name: Build frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build CLI
        run: cargo build --release --manifest-path cli/Cargo.toml

      - name: Stage CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          os="$(echo "${RUNNER_OS}" | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          case "${arch}" in
            x86_64|amd64) arch="x86_64" ;;
            aarch64|arm64) arch="aarch64" ;;
          esac
          cp cli/target/release/kensaku-cli "dist/kensaku-cli-${os}-${arch}"
          chmod +x "dist/kensaku-cli-${os}-${arch}"

      - name: Stage CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
          Copy-Item cli/target/release/kensaku-cli.exe "dist/kensaku-cli-windows-$arch.exe"

      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/kensaku-cli-*
          if-no-files-found: error
