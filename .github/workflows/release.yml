name: Release

# Pushing a `v*` tag builds and publishes a draft GitHub release.
# `workflow_dispatch` is also supported: run it from a `v*` tag ref, because
# `github.ref_name` is used as the release tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Bundles (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            # Default target only.
            args: ""
            targets: x86_64-unknown-linux-gnu
          - platform: macos-latest
            # One universal .app/.dmg for Intel and Apple Silicon.
            args: "--target universal-apple-darwin"
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            # Default target only.
            args: ""
            targets: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # tauri-action runs on the runner's preinstalled Node.js, so setup-node is
      # not required here. Add actions/setup-node@v4 only if a specific Node
      # version becomes necessary.

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # ---------------------------------------------------------------------
      # Code signing / notarization (intentionally not configured)
      # ---------------------------------------------------------------------
      # This workflow produces unsigned builds and requires no signing secrets.
      # To enable signing later, add the secrets below to the repository and
      # expose them in the `env:` block of the tauri-action step:
      #
      #   macOS:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
      #            APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD,
      #            APPLE_TEAM_ID (tauri-action signs and notarizes)
      #   Windows: WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD
      #            (or a dedicated signtool step before bundling)
      #   Linux:   AppImage/deb bundles are unsigned by convention
      #
      # Tauri updater signatures (TAURI_SIGNING_PRIVATE_KEY and its password)
      # are separate and only needed if the updater is enabled.
      # ---------------------------------------------------------------------

      - name: Build and publish draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Kensaku ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # CLI binaries are built separately because tauri-action only uploads the
  # desktop bundles. They are published as workflow artifacts (download them
  # from the Actions run) rather than release assets: the draft release id is
  # not readily available outside the tauri-action step, so attaching them with
  # `gh release upload` would need extra plumbing. Artifacts are the simpler,
  # correct option for unsigned builds. If release assets become a requirement,
  # run `gh release upload "${{ github.ref_name }}" dist/kensaku-cli-* --clobber`
  # in a job that `needs:` this one and has `contents: write`.
  cli:
    name: CLI artifact (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact: kensaku-cli-linux
            targets: x86_64-unknown-linux-gnu
          - platform: macos-latest
            artifact: kensaku-cli-macos
            targets: aarch64-apple-darwin
          - platform: windows-latest
            artifact: kensaku-cli-windows
            targets: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      # The CLI links the `kensaku_lib` crate, whose `generate_context!` embeds
      # the frontend assets, so the web build has to exist first.
      - name: Build frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build CLI
        run: cargo build --release --bin kensaku-cli --manifest-path src-tauri/Cargo.toml

      - name: Stage CLI binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          os="$(echo "${RUNNER_OS}" | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          case "${arch}" in
            x86_64|amd64) arch="x86_64" ;;
            aarch64|arm64) arch="aarch64" ;;
          esac
          cp src-tauri/target/release/kensaku-cli "dist/kensaku-cli-${os}-${arch}"
          ls -l dist

      - name: Stage CLI binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
          Copy-Item src-tauri/target/release/kensaku-cli.exe "dist/kensaku-cli-windows-$arch.exe"
          Get-ChildItem dist

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/kensaku-cli-*
          if-no-files-found: error
