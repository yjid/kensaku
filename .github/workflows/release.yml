name: Release builds

# Builds desktop bundles and the agent CLI for Linux, macOS and
# Windows, Authenticode-signs the Windows binaries through SignPath
# Foundation, then assembles a draft GitHub release with every asset, the
# updater manifest (latest.json), the one-line installers, and a SHA256SUMS
# file. A maintainer reviews and publishes the draft.
#
# Signing is mandatory for tag builds: if the SignPath variables/secrets are
# missing, the Windows jobs fail instead of silently shipping unsigned
# installers. macOS remains unsigned until an Apple Developer ID exists.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Bundles (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    env:
      # Tauri signs every updater artifact with this minisign key. An empty
      # secret fails the bundle step instead of publishing an unsigned update.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact: kensaku-linux
            args: "--config src-tauri/tauri.onnxruntime.linux.conf.json"
            ort_platform: linux-x64
          - platform: macos-latest
            artifact: kensaku-macos
            args: "--target universal-apple-darwin --config src-tauri/tauri.onnxruntime.macos.conf.json"
            ort_platform: osx-arm64
          - platform: windows-latest
            artifact: kensaku-windows
            args: "--config src-tauri/tauri.onnxruntime.windows.conf.json"
            arch: x64
            ort_platform: win-x64
          # Native Windows on ARM (Snapdragon) build: x64 builds only run
          # there under emulation, and the bundled onnxruntime.dll must match
          # the process architecture or PP-OCR cannot load.
          - platform: windows-11-arm
            artifact: kensaku-windows-arm64
            args: "--config src-tauri/tauri.onnxruntime.windows.conf.json"
            arch: arm64
            ort_platform: win-arm64

    steps:
      - uses: actions/checkout@v7

      # `createUpdaterArtifacts` makes the bundler sign every updater artifact.
      # Fail before the long build if the key is missing, instead of publishing
      # a release no installed copy can verify.
      - name: Check updater signing configuration
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "TAURI_SIGNING_PRIVATE_KEY is not set; refusing to build unsigned updater artifacts"
            exit 1
          }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || {
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not set"
            exit 1
          }

      # SignPath Foundation issues the Authenticode certificate; the private
      # key stays on SignPath's HSM. Configuration lives in repository
      # variables plus one secret (see docs/SIGNING.md). Failing here is
      # deliberate: a tag build must not ship unsigned installers.
      - name: Check Windows signing configuration
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $missing = @()
          if (-not $env:SIGNPATH_ORGANIZATION_ID) { $missing += 'variable SIGNPATH_ORGANIZATION_ID' }
          if (-not $env:SIGNPATH_PROJECT_SLUG) { $missing += 'variable SIGNPATH_PROJECT_SLUG' }
          if (-not $env:SIGNPATH_SIGNING_POLICY_SLUG) { $missing += 'variable SIGNPATH_SIGNING_POLICY_SLUG' }
          if (-not $env:SIGNPATH_ARTIFACT_CONFIGURATION_SLUG) { $missing += 'variable SIGNPATH_ARTIFACT_CONFIGURATION_SLUG' }
          if (-not $env:SIGNPATH_API_TOKEN) { $missing += 'secret SIGNPATH_API_TOKEN' }
          if ($missing.Count -gt 0) {
            throw "SignPath signing is not configured; missing: $($missing -join ', '). See docs/SIGNING.md."
          }

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            ${{
              matrix.platform == 'macos-latest'
                && 'aarch64-apple-darwin,x86_64-apple-darwin'
                || ''
            }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: bundle-${{ matrix.platform }}
          cache-on-failure: true

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # The `ort` crate is built with `load-dynamic` and compiled against
      # ONNX Runtime 1.31, so PP-OCR only works when that library ships with
      # the app (see `ocr::runtime_candidates`). Without it the accurate
      # engine can never load: Windows may even find an old, incompatible
      # copy in System32, and macOS/Linux have none at all.
      #
      # The 1.31.0 library is extracted from the v1.0.18 bundles because
      # upstream removed the standalone archives (see
      # .github/actions/fetch-ort). The staged file is added as a bundle
      # resource by the per-platform `--config`, so local builds keep working
      # without it. 1.31 has no Intel macOS build; on Intel Macs PP-OCR says
      # so and Tesseract is used.
      - name: Fetch ONNX Runtime
        uses: ./.github/actions/fetch-ort
        with:
          platform: ${{ matrix.ort_platform }}
          dest: ${{ runner.temp }}/ort

      - name: Stage ONNX Runtime
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ort/onnxruntime-${{ matrix.ort_platform }}-1.31.0"
          case "$RUNNER_OS" in
            Windows) cp "$root/lib/onnxruntime.dll" src-tauri/onnxruntime.dll; dest=src-tauri/onnxruntime.dll ;;
            macOS)   cp "$root/lib/libonnxruntime.1.31.0.dylib" src-tauri/libonnxruntime.dylib; dest=src-tauri/libonnxruntime.dylib ;;
            Linux)   cp "$root/lib/libonnxruntime.so.1.31.0" src-tauri/libonnxruntime.so; dest=src-tauri/libonnxruntime.so ;;
            *) echo "unexpected runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          test -s "$dest"

      # Build first without bundling, so the application executable can be
      # signed before it is embedded in the NSIS and MSI installers.
      - name: Build app binary
        run: bunx tauri build --no-bundle ${{ matrix.args }}

      - name: Prepare app binary for signing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path signing\app | Out-Null
          $exe = "src-tauri\target\release\kensaku.exe"
          if (-not (Test-Path $exe)) { throw "kensaku.exe was not built" }
          Copy-Item $exe signing\app\kensaku.exe

      - name: Upload unsigned app binary
        if: runner.os == 'Windows'
        id: upload-app
        uses: actions/upload-artifact@v7
        with:
          name: sign-app-${{ matrix.arch }}
          path: signing/app
          retention-days: 1

      - name: Sign app binary
        if: runner.os == 'Windows'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signing/signed-app

      - name: Restore signed app binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $signed = Get-ChildItem -Recurse -File signing\signed-app -Filter kensaku.exe | Select-Object -First 1
          if (-not $signed) { throw "SignPath did not return a signed kensaku.exe" }
          $sig = Get-AuthenticodeSignature $signed.FullName
          # `test-signing` uses a self-signed certificate, so Windows reports
          # UnknownError (untrusted root) although the signature itself is
          # intact. A release build must chain to a public CA, so demand Valid.
          $okStatuses = if ($env:SIGNPATH_SIGNING_POLICY_SLUG -eq 'release-signing') {
            @('Valid')
          } else {
            @('Valid', 'UnknownError')
          }
          if ($sig.Status -notin $okStatuses) {
            throw "kensaku.exe came back without a valid signature ($($sig.Status))"
          }
          Write-Host "kensaku.exe: $($sig.Status) by $($sig.SignerCertificate.Subject)"
          Copy-Item $signed.FullName src-tauri\target\release\kensaku.exe -Force

      # `--no-binary-patching` keeps that signature valid: otherwise Tauri
      # rewrites the executable in place per bundle type to embed updater
      # metadata, which invalidates Authenticode. The updater identifies the
      # package from the downloaded bytes, and latest.json publishes the NSIS
      # artifact for every Windows install, so the per-bundle marker is not
      # needed. MSI and portable installs are excluded at runtime (see
      # `updater_supported`).
      - name: Bundle installers
        run: bunx tauri bundle ${{ runner.os == 'Windows' && '--no-binary-patching' || '' }} ${{ matrix.args }}

      - name: Prepare installers for signing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path signing\installers | Out-Null
          Copy-Item src-tauri\target\release\bundle\nsis\*-setup.exe signing\installers\
          Copy-Item src-tauri\target\release\bundle\msi\*.msi signing\installers\
          $files = @(Get-ChildItem signing\installers -File)
          if ($files.Count -lt 2) { throw "expected an NSIS setup.exe and an MSI, found $($files.Count)" }

      - name: Upload unsigned installers
        if: runner.os == 'Windows'
        id: upload-installers
        uses: actions/upload-artifact@v7
        with:
          name: sign-installers-${{ matrix.arch }}
          path: signing/installers
          retention-days: 1

      - name: Sign installers
        if: runner.os == 'Windows'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-installers.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signing/signed-installers

      - name: Restore signed installers
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $signed = @(Get-ChildItem -Recurse -File signing\signed-installers |
            Where-Object { $_.Extension -in '.exe', '.msi' })
          if ($signed.Count -eq 0) { throw "SignPath did not return any signed installers" }
          $okStatuses = if ($env:SIGNPATH_SIGNING_POLICY_SLUG -eq 'release-signing') {
            @('Valid')
          } else {
            @('Valid', 'UnknownError')
          }
          foreach ($file in $signed) {
            $sig = Get-AuthenticodeSignature $file.FullName
            if ($sig.Status -notin $okStatuses) {
              throw "$($file.Name) came back without a valid signature ($($sig.Status))"
            }
            $dest = Get-ChildItem -Recurse -File src-tauri\target\release\bundle -Filter $file.Name |
              Select-Object -First 1
            if (-not $dest) { throw "no bundle destination for $($file.Name)" }
            Copy-Item $file.FullName $dest.FullName -Force
            Write-Host "$($file.Name): $($sig.Status) by $($sig.SignerCertificate.Subject)"
          }

      # `tauri bundle` signed the updater artifacts before SignPath re-signed
      # the installers, so those signatures no longer match the bytes that
      # ship. Re-sign the final NSIS installer for the updater. Windows updates
      # use the NSIS package only; the MSI stays a manual/enterprise install,
      # so its stale signature is removed rather than published.
      - name: Re-sign Windows updater artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsis = @(Get-ChildItem src-tauri\target\release\bundle\nsis -Filter '*-setup.exe' -File)
          if ($nsis.Count -ne 1) { throw "expected exactly one NSIS installer, found $($nsis.Count)" }
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          Get-ChildItem src-tauri\target\release\bundle\msi -Filter '*.msi.sig' -File -ErrorAction SilentlyContinue |
            Remove-Item -Force
          Remove-Item "$($nsis[0].FullName).sig" -Force -ErrorAction SilentlyContinue
          bunx tauri signer sign --app-version $version $nsis[0].FullName
          if (-not (Test-Path "$($nsis[0].FullName).sig")) {
            throw "updater signature was not written"
          }
          Write-Host "signed $($nsis[0].Name) for version $version"

      # Portable build: the raw exe plus a `portable` marker file so
      # KensakuConfig::config_dir keeps everything (config, metadata DB,
      # content index, thumbs, OCR state) in <exe_dir>/data — no registry,
      # no %APPDATA%. The zip is the artifact #68 asks for.
      - name: Zip Windows portable build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path "dist\portable" | Out-Null
          Copy-Item "src-tauri\target\release\kensaku.exe" "dist\portable\kensaku.exe"

          # ONNX Runtime must sit next to the exe. The bundled installers get it
          # as a Tauri resource, but this zip is hand-assembled and previously
          # shipped without it: Indra and PP-OCR could never load on a portable
          # install, on every machine, permanently. Fail the build rather than
          # publish an artifact with dead OCR.
          $ort = "src-tauri\target\release\onnxruntime.dll"
          if (-not (Test-Path $ort)) { $ort = "src-tauri\onnxruntime.dll" }
          if (-not (Test-Path $ort)) { throw "onnxruntime.dll not staged; portable zip would ship without OCR" }
          Copy-Item $ort "dist\portable\onnxruntime.dll"
          if (-not (Test-Path "dist\portable\onnxruntime.dll")) { throw "onnxruntime.dll was not copied into the portable folder" }

          Set-Content -Path "dist\portable\portable" -Value "" -NoNewline -Encoding ascii
          @'
          Kensaku portable
          ================
          Run kensaku.exe. Configuration, the index and all data live in
          the `data` folder next to the exe; nothing is written to the
          registry or %APPDATA%. Keep the `portable` marker file in place,
          or Kensaku falls back to the user profile directory.

          The folder must be writable. Requires the system WebView2
          runtime, preinstalled on Windows 10 1803+ and Windows 11.

          Keep onnxruntime.dll next to kensaku.exe: the OCR engines need it.
          If it is removed, text search still works but image and scanned-PDF
          search is disabled.
          '@ | Set-Content -Path "dist\portable\README.txt"
          Compress-Archive -Path "dist\portable\*" -DestinationPath "dist\kensaku-portable-$version-${{ matrix.arch }}.zip" -Force
          Remove-Item -Recurse -Force "dist\portable"
          $zip = Get-ChildItem "dist\kensaku-portable-$version-${{ matrix.arch }}.zip"
          Write-Output "staged $($zip.Name) ($([math]::Round($zip.Length / 1MB, 1)) MB)"

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/*/release/bundle/**
            dist/kensaku-portable-*.zip
          if-no-files-found: error

  cli:
    name: CLI (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact: kensaku-cli-linux
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            artifact: kensaku-cli-macos
            target: aarch64-apple-darwin
          - platform: windows-latest
            artifact: kensaku-cli-windows
            target: x86_64-pc-windows-msvc
          - platform: windows-11-arm
            artifact: kensaku-cli-windows-arm64
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7

      # Same mandatory check as the bundle job: the Windows CLI binaries are
      # what users run from a terminal, so they are signed too.
      - name: Check Windows signing configuration
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $missing = @()
          if (-not $env:SIGNPATH_ORGANIZATION_ID) { $missing += 'variable SIGNPATH_ORGANIZATION_ID' }
          if (-not $env:SIGNPATH_PROJECT_SLUG) { $missing += 'variable SIGNPATH_PROJECT_SLUG' }
          if (-not $env:SIGNPATH_SIGNING_POLICY_SLUG) { $missing += 'variable SIGNPATH_SIGNING_POLICY_SLUG' }
          if (-not $env:SIGNPATH_ARTIFACT_CONFIGURATION_SLUG) { $missing += 'variable SIGNPATH_ARTIFACT_CONFIGURATION_SLUG' }
          if (-not $env:SIGNPATH_API_TOKEN) { $missing += 'secret SIGNPATH_API_TOKEN' }
          if ($missing.Count -gt 0) {
            throw "SignPath signing is not configured; missing: $($missing -join ', '). See docs/SIGNING.md."
          }

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli -> target
          key: cli-${{ matrix.platform }}
          cache-on-failure: true

      # generate_context! embeds the frontend, so build it before cargo.
      - name: Build frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build CLI
        run: cargo build --release --locked --manifest-path cli/Cargo.toml

      - name: Build universal macOS CLI
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --locked --manifest-path cli/Cargo.toml --target x86_64-apple-darwin
          mkdir -p dist
          # The host (macos-latest) is arm64, so the generic build above is the
          # aarch64 slice; only the x86_64 slice needs an explicit --target.
          lipo -create \
            cli/target/release/kensaku-cli \
            cli/target/x86_64-apple-darwin/release/kensaku-cli \
            -output dist/kensaku-cli-macos-universal

      - name: Stage CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          os="$(echo "${RUNNER_OS}" | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          case "${arch}" in
            x86_64|amd64) arch="x86_64" ;;
            aarch64|arm64) arch="aarch64" ;;
          esac
          cp cli/target/release/kensaku-cli "dist/kensaku-cli-${os}-${arch}"
          chmod +x "dist/kensaku-cli-${os}-${arch}"

      - name: Stage CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
          Copy-Item cli/target/release/kensaku-cli.exe "dist/kensaku-cli-windows-$arch.exe"

      - name: Upload unsigned CLI for signing
        if: runner.os == 'Windows'
        id: upload-cli
        uses: actions/upload-artifact@v7
        with:
          name: sign-cli-${{ matrix.artifact }}
          path: dist/kensaku-cli-windows-*.exe
          retention-days: 1

      - name: Sign CLI
        if: runner.os == 'Windows'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-cli.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-cli

      - name: Restore signed CLI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $signed = @(Get-ChildItem -Recurse -File signed-cli -Filter kensaku-cli-windows-*.exe)
          if ($signed.Count -eq 0) { throw "SignPath did not return a signed CLI binary" }
          $okStatuses = if ($env:SIGNPATH_SIGNING_POLICY_SLUG -eq 'release-signing') {
            @('Valid')
          } else {
            @('Valid', 'UnknownError')
          }
          foreach ($file in $signed) {
            $sig = Get-AuthenticodeSignature $file.FullName
            if ($sig.Status -notin $okStatuses) {
              throw "$($file.Name) came back without a valid signature ($($sig.Status))"
            }
            Write-Host "$($file.Name): $($sig.Status) by $($sig.SignerCertificate.Subject)"
            Copy-Item $file.FullName "dist\$($file.Name)" -Force
          }

      - name: Upload CLI
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/kensaku-cli-*
          if-no-files-found: error

  # Assemble one draft GitHub release from both build jobs. A maintainer
  # reviews the draft, then publishes it; this keeps signing and announcement
  # decisions out of tag pushes while still collecting every asset in one
  # place (bundles, CLI binaries, latest.json, and SHA256SUMS).
  publish:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bundle, cli]
    # ubuntu-24.04 is pinned: `ubuntu-latest` will migrate to Ubuntu 26
    # (actions/runner-images#14748), which could change release/asset
    # behavior without notice.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Checkout must run before the artifact download: checkout defaults to
      # `clean: true`, which wipes the workspace and deletes the downloaded
      # artifacts (this is what broke the v1.0.1 release runs).
      - name: Checkout (for release notes generation)
        uses: actions/checkout@v7

      # Only the final artifacts: the `sign-*` intermediates contain the
      # unsigned files that SignPath needs, and must never be staged as
      # release assets.
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: kensaku-*
          merge-multiple: true

      - name: Check artifacts arrived
        run: |
          test -d artifacts
          find artifacts -type f | grep -q . || { echo "no artifacts downloaded"; exit 1; }

      # Bundle directories contain support files with identical basenames
      # (icon.icns, icon.ico, ...). Only stage installable artifacts and the
      # updater signatures so the release never gets two assets with the same
      # name. MSI signatures are deliberately omitted: Windows in-app updates
      # use the NSIS package, and the MSI is a manual/enterprise install.
      - name: Stage release assets
        run: |
          mkdir -p release
          find artifacts -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.AppImage.sig' -o -name '*.dmg' -o -name '*.msi' \
               -o -name '*-setup.exe' -o -name '*-setup.exe.sig' \
               -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \
               -o -name 'kensaku-portable-*.zip' \
               -o -name 'kensaku-cli-*' \) \
            -exec cp -t release {} +
          test -n "$(find release -type f -print -quit)" || { echo "no release assets staged"; exit 1; }
          cp install.sh install.ps1 release/
          test -s release/install.sh
          test -s release/install.ps1

      # The updater downloads this manifest from
      # releases/latest/download/latest.json. It must contain the signature of
      # each artifact; a missing signature or artifact fails the build rather
      # than publishing an update nobody can install.
      - name: Generate updater manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node tools/generate-latest-json.mjs

      - name: Write checksums
        run: |
          cd release
          find . -type f ! -name SHA256SUMS -exec sha256sum {} + | sort -k2 > SHA256SUMS

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "Kensaku $TAG" --generate-notes
          find release -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
