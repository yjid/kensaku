name: CI

# Only run for changes that can actually land: PRs and pushes to master.
# Pushing scratch branches no longer queues two 20-minute Rust jobs.
on:
  push:
    branches: [master]
  pull_request:

# The default token is write-all; none of these jobs need more than read.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    # ubuntu-24.04 is pinned: `ubuntu-latest` will migrate to Ubuntu 26
    # (actions/runner-images#14748), which would change the toolchain layout
    # under this job without notice.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Check shell installer syntax
        run: bash -n install.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run test
      - run: bun run build

  rust:
    name: Rust
    runs-on: ubuntu-22.04
    # A compile plus tests takes about 10 minutes. Without a bound, a stalled
    # download or build hangs until the workflow timeout.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # `generate_context!` embeds `frontendDist`, so the web build must exist
      # before any cargo command compiles the lib.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Cache Cargo target directory
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  # The CLI is a separate workspace with its own lockfile and is only built at
  # release time. Without this job a stale cli/Cargo.lock (or an API break in
  # the library it depends on) stays invisible until a tag is pushed.
  cli:
    name: CLI
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Cache Cargo target directory
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli -> target
          cache-on-failure: true
      - run: cargo fmt --manifest-path cli/Cargo.toml --all -- --check
      - run: cargo test --locked --manifest-path cli/Cargo.toml
      - run: cargo clippy --locked --manifest-path cli/Cargo.toml --all-targets -- -D warnings

  # Windows-gated code (drive roots, Tauri bounds, Win32 APIs) must compile
  # before it reaches the release matrix. Compile-only; the Linux jobs remain
  # authoritative for tests and lints.
  windows:
    name: Rust (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Check PowerShell installer syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Cache Cargo target directory
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows
          cache-on-failure: true
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets
      - run: cargo check --locked --manifest-path cli/Cargo.toml --all-targets
