# github.com/yjid/kensaku
#
# The `glib` crate sits in both lockfiles at 0.18 via Tauri 2's GTK 0.18
# stack. RUSTSEC-2024-0429 marks glib >= 0.15.0, < 0.20.0 as affected, so
# Dependabot keeps launching security updates for it and every run fails
# with `security_update_not_possible`: the earliest fixed version is 0.20.0,
# which cargo cannot resolve next to tauri/gtk 0.18. Ignore it until the
# Tauri crate stack moves to gtk 0.20+, and dismiss the Dependabot alerts
# as "no fix available".
#
# Practical risk is low either way: glib is transitively pulled by gtk and
# only linked on Linux, Kensaku never calls `VariantStrIter`, and per the
# advisory the unsoundness manifests as NULL-deref crashes, not
# attacker-controlled undefined behavior.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    ignore:
      - dependency-name: glib
    groups:
      cargo-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: cargo
    directory: /cli
    schedule:
      interval: weekly
    ignore:
      - dependency-name: glib
    groups:
      cargo-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # Bun is the only JavaScript package manager this repo uses: CI and release
  # run `bun install --frozen-lockfile`, which reads bun.lock. The npm
  # ecosystem made Dependabot write package-lock.json, so every npm PR failed
  # at the frozen lockfile step.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Majors need a deliberate migration (TypeScript 7, i18next 27, etc.);
    # do not open red PRs for them automatically.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
