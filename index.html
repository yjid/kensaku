<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kensaku</title>
<script>
      // Apply stored theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("kensaku.theme");
        var map = { paper: "light", light: "light", void: "dark", dark: "dark", };
        document.documentElement.dataset.theme = map[t] || "dark";
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
