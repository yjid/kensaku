<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kensaku</title>
<script>
      // Apply stored theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("kensaku.theme");
        var map = { paper: "light", light: "light", void: "dark", dark: "dark", glass: "glass" };
        document.documentElement.dataset.theme = map[t] || "dark";
        // Chromium can refract through an SVG lens; WebKit cannot.
        if (/Chrome\/|Chromium|Edg\//.test(navigator.userAgent)) document.documentElement.dataset.refract = "1";
      } catch (e) {}
    </script>
  </head>

  <body>
    <!-- Liquid Glass lens: a soft, low-frequency displacement of what sits
         behind a control. Used only where the engine supports it. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <filter id="liquid-lens" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="1" seed="3" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="3" result="soft" />
        <feDisplacementMap in="SourceGraphic" in2="soft" scale="34" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
